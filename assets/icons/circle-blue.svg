<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      @keyframes draw-1 { 0% { stroke-dashoffset: 16; } 100% { stroke-dashoffset: 0; } }
      @keyframes pop-1 { 0% { opacity: 0; transform: scale(0); } 60% { opacity: 1; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes bounce-1 { 0% { transform: scale(1) rotate(0deg); } 30% { transform: scale(1.18) rotate(3deg); } 55% { transform: scale(0.92) rotate(-2deg); } 78% { transform: scale(1.06) rotate(1deg); } 100% { transform: scale(1) rotate(0deg); } }
      .p1 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; }
      .f1 { fill: #CC785C; stroke: none; opacity: 0; }
      .p1 { animation: draw-1 0.3s cubic-bezier(0.42,0,0.58,1) forwards; }
      .f1 { animation: pop-1 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.1s forwards; transform-origin: 12px 12px; }
      .bounce { animation: bounce-1 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.6s forwards; transform-origin: 12px 12px; }
    </style>
  </defs>
  <g class="bounce">
    <circle class="f1" cx="12" cy="12" r="6"/>
    <circle class="p1" cx="12" cy="12" r="6"/>
  </g>
</svg>
