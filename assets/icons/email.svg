<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      @keyframes draw-1 { 0% { stroke-dashoffset: 32; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-2 { 0% { stroke-dashoffset: 44; } 100% { stroke-dashoffset: 0; } }
      @keyframes bounce-1 { 0% { transform: scale(1) rotate(0deg); } 30% { transform: scale(1.18) rotate(3deg); } 55% { transform: scale(0.92) rotate(-2deg); } 78% { transform: scale(1.06) rotate(1deg); } 100% { transform: scale(1) rotate(0deg); } }
      .p1 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 32; stroke-dashoffset: 32; }
      .p2 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 44; stroke-dashoffset: 44; }
      .p1 { animation: draw-1 0.5s cubic-bezier(0.42,0,0.58,1) forwards; }
      .p2 { animation: draw-2 0.6s cubic-bezier(0.42,0,0.58,1) 0.15s forwards; }
      .bounce { animation: bounce-1 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.8s forwards; transform-origin: 12px 12px; }
    </style>
  </defs>
  <g class="bounce">
    <path class="p1" d="M4,8 L4,16 C4,17 5,18 6,18 L9,18 L9,21 L13,18 L18,18 C19,18 20,17 20,16 L20,8 C20,7 19,6 18,6 L6,6 C5,6 4,7 4,8 Z"/>
    <path class="p2" d="M8,10 L16,10 L16,14 L8,14 Z"/>
  </g>
</svg>
