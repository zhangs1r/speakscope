<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      @keyframes draw-1 { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-2 { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-3 { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-4 { 0% { stroke-dashoffset: 10; } 100% { stroke-dashoffset: 0; } }
      @keyframes bounce-1 { 0% { transform: scale(1) rotate(0deg); } 30% { transform: scale(1.18) rotate(3deg); } 55% { transform: scale(0.92) rotate(-2deg); } 78% { transform: scale(1.06) rotate(1deg); } 100% { transform: scale(1) rotate(0deg); } }
      .p1 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; }
      .p2 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; }
      .p3 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; }
      .p4 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10; stroke-dashoffset: 10; }
      .p1 { animation: draw-1 0.8s cubic-bezier(0.42,0,0.58,1) forwards; }
      .p2 { animation: draw-2 0.8s cubic-bezier(0.42,0,0.58,1) 0.15s forwards; }
      .p3 { animation: draw-3 0.4s cubic-bezier(0.42,0,0.58,1) 0.30s forwards; }
      .p4 { animation: draw-4 0.3s cubic-bezier(0.42,0,0.58,1) 0.45s forwards; }
      .bounce { animation: bounce-1 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.0s forwards; transform-origin: 12px 12px; }
    </style>
  </defs>
  <g class="bounce">
    <path class="p1" d="M4,19.5 L4,5 C4,3.5 5,3 6,3 L12,6 L12,21 L6,21 C5,21 4,20.5 4,19.5 Z"/>
    <path class="p2" d="M20,19.5 L20,5 C20,3.5 19,3 18,3 L12,6 L12,21 L18,21 C19,21 20,20.5 20,19.5 Z"/>
    <path class="p3" d="M8,8 L10,8"/>
    <path class="p4" d="M8,11 L10,11"/>
  </g>
</svg>
