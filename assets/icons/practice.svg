<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      @keyframes draw-1 { 0% { stroke-dashoffset: 32; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-2 { 0% { stroke-dashoffset: 50; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-3 { 0% { stroke-dashoffset: 18; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-4 { 0% { stroke-dashoffset: 18; } 100% { stroke-dashoffset: 0; } }
      @keyframes bounce-1 { 0% { transform: scale(1) rotate(0deg); } 30% { transform: scale(1.18) rotate(3deg); } 55% { transform: scale(0.92) rotate(-2deg); } 78% { transform: scale(1.06) rotate(1deg); } 100% { transform: scale(1) rotate(0deg); } }
      .p1 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 32; stroke-dashoffset: 32; }
      .p2 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; }
      .p3 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18; stroke-dashoffset: 18; }
      .p4 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18; stroke-dashoffset: 18; }
      .p1 { animation: draw-1 0.6s cubic-bezier(0.42,0,0.58,1) forwards; }
      .p2 { animation: draw-2 0.8s cubic-bezier(0.42,0,0.58,1) 0.15s forwards; }
      .p3 { animation: draw-3 0.4s cubic-bezier(0.42,0,0.58,1) 0.30s forwards; }
      .p4 { animation: draw-4 0.4s cubic-bezier(0.42,0,0.58,1) 0.45s forwards; }
      .bounce { animation: bounce-1 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.0s forwards; transform-origin: 12px 12px; }
    </style>
  </defs>
  <g class="bounce">
    <path class="p1" d="M5,14 L5,10"/>
    <path class="p2" d="M5,10 C5,5 19,5 19,10"/>
    <path class="p3" d="M19,14 L19,18"/>
    <path class="p4" d="M5,18 L19,18"/>
  </g>
</svg>
