        100% { transform:scale(1) rotate(0deg); }
      }
      .p0 { animation: draw 3.5s ease-in-out 0.0s forwards; stroke-dasharray:210; stroke-dashoffset:210; }
      .bx { animation: bounce 0.7s cubic-bezier(0.34,1.56,0.64,1) 3.7s forwards; }
    </style>
