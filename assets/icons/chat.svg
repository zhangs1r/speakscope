<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      @keyframes draw-1 { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-2 { 0% { stroke-dashoffset: 16; } 100% { stroke-dashoffset: 0; } }
      @keyframes pop-1 { 0% { opacity: 0; transform: scale(0); } 60% { opacity: 1; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes bounce-1 { 0% { transform: scale(1) rotate(0deg); } 30% { transform: scale(1.18) rotate(3deg); } 55% { transform: scale(0.92) rotate(-2deg); } 78% { transform: scale(1.06) rotate(1deg); } 100% { transform: scale(1) rotate(0deg); } }
      .p1 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; }
      .p2 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; }
      .f1 { fill: #CC785C; stroke: none; opacity: 0; }
      .p1 { animation: draw-1 0.6s cubic-bezier(0.42,0,0.58,1) forwards; }
      .p2 { animation: draw-2 0.4s cubic-bezier(0.42,0,0.58,1) 0.15s forwards; }
      .f1 { animation: pop-1 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.4s forwards; transform-origin: 12px 10px; }
      .bounce { animation: bounce-1 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.8s forwards; transform-origin: 12px 12px; }
    </style>
  </defs>
  <g class="bounce">
    <path class="p1" d="M4,4 L20,4 C21,4 22,5 22,6 L22,16 C22,17 21,18 20,18 L12,18 L7,22 L7,18 L4,18 C3,18 2,17 2,16 L2,6 C2,5 3,4 4,4 Z"/>
    <path class="p2" d="M8,9 L16,9"/>
    <circle class="f1" cx="12" cy="12" r="2"/>
  </g>
</svg>
