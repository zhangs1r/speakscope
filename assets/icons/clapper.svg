<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <style>
      @keyframes draw-1 { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-2 { 0% { stroke-dashoffset: 32; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-3 { 0% { stroke-dashoffset: 36; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-4 { 0% { stroke-dashoffset: 12; } 100% { stroke-dashoffset: 0; } }
      @keyframes draw-5 { 0% { stroke-dashoffset: 12; } 100% { stroke-dashoffset: 0; } }
      @keyframes bounce-1 { 0% { transform: scale(1) rotate(0deg); } 30% { transform: scale(1.18) rotate(3deg); } 55% { transform: scale(0.92) rotate(-2deg); } 78% { transform: scale(1.06) rotate(1deg); } 100% { transform: scale(1) rotate(0deg); } }
      .p1 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; }
      .p2 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 32; stroke-dashoffset: 32; }
      .p3 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 36; stroke-dashoffset: 36; }
      .p4 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 12; stroke-dashoffset: 12; }
      .p5 { fill: none; stroke: #CC785C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 12; stroke-dashoffset: 12; }
      .p1 { animation: draw-1 0.6s cubic-bezier(0.42,0,0.58,1) forwards; }
      .p2 { animation: draw-2 0.5s cubic-bezier(0.42,0,0.58,1) 0.15s forwards; }
      .p3 { animation: draw-3 0.5s cubic-bezier(0.42,0,0.58,1) 0.30s forwards; }
      .p4 { animation: draw-4 0.3s cubic-bezier(0.42,0,0.58,1) 0.45s forwards; }
      .p5 { animation: draw-5 0.3s cubic-bezier(0.42,0,0.58,1) 0.60s forwards; }
      .bounce { animation: bounce-1 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.1s forwards; transform-origin: 12px 12px; }
    </style>
  </defs>
  <g class="bounce">
    <path class="p1" d="M3,8 L6,4 L21,4 L21,20 L3,20 Z"/>
    <path class="p2" d="M7,4 L3,8 L10,8 L14,4 Z"/>
    <path class="p3" d="M7,12 L17,12 L17,17 L7,17 Z"/>
    <path class="p4" d="M9,14 L15,14"/>
    <path class="p5" d="M9,16 L13,16"/>
  </g>
</svg>
