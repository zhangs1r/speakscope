<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第 {LESSON_ID} 课：{TITLE} · Animal Farm 精读 · SpeakScope</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  body { background: var(--paper-light); }
  .lesson { max-width: 880px; margin: 0 auto; padding: var(--space-8) var(--space-6); }
  .lesson h1 { font-family: var(--font-serif); font-size: var(--text-4xl); margin-bottom: 0.2rem; }
  .lesson .subtitle { font-size: var(--text-lg); color: var(--ink-60); font-family: var(--font-serif); }
  .lesson .meta { display: flex; gap: var(--space-3); margin: var(--space-4) 0 var(--space-8); flex-wrap: wrap; }
  .lesson .meta span { padding: 0.3rem 0.8rem; border-radius: 6px; background: var(--paper); border: 1px solid var(--border-light); font-size: var(--text-sm); color: var(--ink-60); }
  .lesson .content { line-height: 1.8; font-size: var(--text-base); }
  .lesson .content h2 { font-family: var(--font-serif); margin: var(--space-8) 0 var(--space-4); padding-bottom: var(--space-1); border-bottom: 1px solid var(--border); }
  .lesson .content h3 { font-family: var(--font-serif); margin: var(--space-6) 0 var(--space-3); }
  .back { display: inline-block; margin-bottom: var(--space-6); color: var(--accent); text-decoration: none; font-size: var(--text-sm); }
  .back:hover { text-decoration: underline; }

  /* Reading passage cards */
  .passage-card {
    background: var(--paper); border: 1px solid var(--border); border-radius: 12px;
    padding: var(--space-6); margin: var(--space-5) 0;
    border-left: 4px solid var(--accent);
  }
  .passage-card .p-en {
    font-family: var(--font-serif); font-size: var(--text-base); line-height: 1.8;
    color: var(--ink);
  }
  .passage-card .p-cn {
    font-size: var(--text-sm); color: var(--ink-60); margin-top: var(--space-3);
    border-top: 1px dashed var(--border); padding-top: var(--space-3);
  }
  .passage-card .p-pre {
    font-size: var(--text-sm); color: var(--accent-deep); font-style: italic;
    margin-bottom: var(--space-3); padding: var(--space-2) var(--space-3);
    background: var(--accent-dim); border-radius: 6px;
  }
  .passage-card .p-note {
    font-size: var(--text-sm); color: var(--ink-60);
    margin-top: var(--space-3); border-top: 1px dashed var(--border-light);
    padding-top: var(--space-3);
  }
  .highlight-blue { background: #dbeafe; padding: 0.1rem 0.2rem; border-radius: 2px; }
  .highlight-yellow { background: #fef3c7; padding: 0.1rem 0.2rem; border-radius: 2px; }

  /* Vocab cards */
  .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-4); margin: var(--space-5) 0; }
  .vocab-card {
    background: var(--paper); border: 1px solid var(--border); border-radius: 8px;
    padding: var(--space-4);
  }
  .vocab-card .v-word { font-weight: 700; font-family: var(--font-serif); font-size: var(--text-lg); display: flex; align-items: center; gap: 0.3rem; }
  .vocab-card .v-pron { font-size: var(--text-xs); color: var(--ink-40); font-style: italic; }
  .vocab-card .v-cn { font-size: var(--text-sm); color: var(--ink-80); margin-top: var(--space-1); }
  .vocab-card .v-example { font-size: var(--text-xs); color: var(--ink-60); margin-top: var(--space-2); font-style: italic; }
  .level-must { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; background: #dbeafe; color: #1e40af; margin-right: 0.3rem; }
  .level-know { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; background: #fef3c7; color: #92400e; margin-right: 0.3rem; }

  /* Map table */
  .map-table { width: 100%; border-collapse: collapse; margin: var(--space-5) 0; font-size: var(--text-sm); }
  .map-table th { text-align: left; background: var(--accent-dim); padding: var(--space-2) var(--space-3); color: var(--accent-deep); font-weight: 600; }
  .map-table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border-light); }

  /* Pre-reading box */
  .pre-box { background: var(--accent-dim); border-radius: 8px; padding: var(--space-4); margin: var(--space-5) 0; border: 1px dashed var(--accent-light); }
  .pre-box strong { color: var(--accent-deep); }

  /* Retrieval practice */
  .retrieval-box { background: var(--paper); border: 2px dashed var(--accent-light); border-radius: 12px; padding: var(--space-5); margin: var(--space-5) 0; }
  .retrieval-box details { margin-top: var(--space-3); }
  .retrieval-box summary { cursor: pointer; font-weight: 600; color: var(--accent-deep); }

  /* Speaking practice */
  .speak-card { background: var(--paper); border: 1px solid var(--border); border-radius: 8px; padding: var(--space-5); margin: var(--space-4) 0; }
  .speak-card .s-level { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--space-2); }
  .speak-card .s-level.mec { color: var(--accent); }
  .speak-card .s-level.con { color: var(--accent-deep); }
  .speak-card .s-level.free { color: #5a9e6f; }
  .speak-card .s-framework { background: var(--accent-dim); padding: var(--space-3); border-radius: 6px; margin: var(--space-3) 0; font-family: var(--font-mono); font-size: var(--text-sm); }
  .speak-card .s-model { background: #f0fdf4; border: 1px solid #bbf7d0; padding: var(--space-3); border-radius: 6px; margin: var(--space-2) 0; font-size: var(--text-sm); }

  /* Exercise box */
  .exercise-box { border: 1px solid var(--border); border-radius: 8px; padding: var(--space-5); margin: var(--space-6) 0; background: var(--paper); }
  .exercise-box summary { cursor: pointer; font-weight: 600; color: var(--accent-deep); font-size: var(--text-base); margin-bottom: var(--space-3); }
  .exercise-box .ex-section { margin: var(--space-3) 0; }
  .quiz-item { margin: var(--space-3) 0; }
  .quiz-item label { display: block; margin: var(--space-1) 0; padding: var(--space-2); border-radius: 4px; cursor: pointer; }
  .quiz-item label:hover { background: var(--accent-dim); }

  .play-btn {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--paper); border: 1px solid var(--accent-light);
    border-radius: 4px; cursor: pointer; font-size: 0.75rem;
    width: 1.6rem; height: 1.6rem; margin-left: 0.4rem; flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    vertical-align: middle; line-height: 1;
  }
  .play-btn:hover { background: var(--accent-dim); transform: scale(1.1); }
  .play-btn:active { transform: scale(0.95); }
  .play-btn.playing { background: #c8e6c9; border-color: var(--success); }

  .callout { background: var(--paper); border: 1px solid var(--border); border-radius: 8px; padding: var(--space-5); margin: var(--space-5) 0; }
  .callout strong { color: var(--accent-deep); }

  .word-cell { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; }
  .footer-nav { margin-top: var(--space-10); padding-top: var(--space-6); border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: var(--text-sm); }
  .footer-nav a { color: var(--accent); text-decoration: none; }
  .footer-nav a:hover { text-decoration: underline; }

  /* Tracking table */
  .track-table { width: 100%; border-collapse: collapse; margin: var(--space-4) 0; font-size: var(--text-sm); }
  .track-table th { text-align: left; background: var(--accent-dim); padding: var(--space-2) var(--space-3); color: var(--accent-deep); font-weight: 600; }
  .track-table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border-light); }
</style>
<script>
const player = new Audio();
let currentBtn = null;
function playAudio(src, btnId) {
  const btn = document.getElementById(btnId);
  if (btn && btn.classList.contains('playing')) {
    player.pause();
    player.currentTime = 0;
    btn.classList.remove('playing');
    currentBtn = null;
    return;
  }
  if (currentBtn) currentBtn.classList.remove('playing');
  player.src = 'assets/audio/animal-farm/' + src;
  player.play();
  if (btn) { btn.classList.add('playing'); currentBtn = btn; }
  player.onended = () => { if (btn) btn.classList.remove('playing'); currentBtn = null; };
}
</script>
</head>
<body>
<div class="lesson">

  <a class="back" href="../index.html">← 返回 SpeakScope 主页</a>
  <h1>{EMOJI} {TITLE}</h1>
  <div class="subtitle">{SUBTITLE}</div>
  <div class="meta">
    <span>⏱ {DURATION}</span>
    <span>📚 英文原著 · Animal Farm</span>
    <span>🏷️ {TAGS}</span>
    <span>{DIFFICULTY}</span>
  </div>

  <div class="content">

{CONTENT}

  </div><!-- /content -->

  <div class="footer-nav">
    <span>{PREV_LINK}</span>
    <a href="../index.html">返回主页</a>
    <span>{NEXT_LINK}</span>
  </div>

</div>
<script src="../shared/lesson-tools.js"></script>
</body>
</html>
